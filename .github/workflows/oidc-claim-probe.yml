name: OIDC claim probe (temporary)

# TEMPORARY Phase 3A evidence; deleted after the probe. Calls the framework's
# probe workflow by EXACT 40-character SHA and records the job_workflow_ref and
# token lifetime GitHub actually emits. Decoded claims only, never a token.
on:
  workflow_dispatch:
  push:
    branches: [probe/oidc-claims]
  pull_request:
    branches: [main]
    paths: [.github/workflows/oidc-claim-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    uses: IamRitz/ssd-security-framework/.github/workflows/_oidc-claim-probe.yml@5cefb1e5ebaec0ae97320d8e271897c07dd81c30
    permissions:
      contents: read
      id-token: write
