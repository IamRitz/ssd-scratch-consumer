name: Security checks

on:
  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 6 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    uses: IamRitz/ssd-security-framework/.github/workflows/_source-scan.yml@3bae4435bb8fb582eb857654b5b3ccee51350905

    permissions:
      contents: read
      pull-requests: write

    with:
      toolkit_ref: 3bae4435bb8fb582eb857654b5b3ccee51350905

      # First onboarding run only.
      gate_mode: enforce

      semgrep_configs: |
        p/owasp-top-ten
        p/python

      semgrep_paths: src

      break_glass_enabled: true
      break_glass_transport: lambda

  break-glass:
    needs:
      - source-security

    # TEST PROBE:
    # Deliberately force the break-glass workflow to inspect ANY BLOCK.
    # Normal production wiring would use:
    # needs.source-security.outputs.break_glass_delegated == 'true'
    if: ${{ always() && needs.source-security.outputs.verdict == 'BLOCK' }}

    uses: IamRitz/ssd-security-framework/.github/workflows/_break-glass-lambda.yml@3bae4435bb8fb582eb857654b5b3ccee51350905

    permissions:
      contents: read
      id-token: write

    with:
      toolkit_ref: 3bae4435bb8fb582eb857654b5b3ccee51350905

      gate_mode: ${{ needs.source-security.outputs.gate_mode }}
      expected_gate_digest: ${{ needs.source-security.outputs.gate_digest }}

      # Syntactically valid dummy production configuration.
      # Preflight must reject the integrity BLOCK BEFORE these can be used.
      lambda_function: ssd-break-glass-prod-placeholder
      lambda_role_arn: arn:aws:iam::111111111111:role/ssd-break-glass-prod-placeholder
      aws_region: us-east-1

      timeout_seconds: '30'

  security-gate:
    name: security-gate
    needs: source-security
    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: Require source security
        env:
          RESULT: ${{ needs.source-security.result }}
          VERDICT: ${{ needs.source-security.outputs.verdict }}
          MODE: ${{ needs.source-security.outputs.gate_mode }}
          TRUSTED: ${{ needs.source-security.outputs.integrity_trusted }}

        run: |
          set -euo pipefail

          echo "source-security: result=$RESULT verdict=${VERDICT:-unknown} trusted=${TRUSTED:-unknown}"


          if [ "$MODE" = "log-only" ]; then
            # Verdict-specific: only a BLOCK is suppressed by log-only. A PASS has
            # nothing to suppress, but log-only stays visible as a rollout mode.
            case "$VERDICT" in
              BLOCK)
                echo "::warning::GREEN BY CONFIGURATION, not by verdict — source verdict BLOCK is reported but NOT enforced because gate_mode is log-only."
                ;;
              PASS|PASS-WITH-EXCEPTIONS)
                echo "::warning::Source verdict $VERDICT. gate_mode is log-only; no blocking verdict exists, so nothing was suppressed. A future BLOCK would not fail this check until the repository moves to enforce."
                ;;
              *)
                echo "::warning::Source verdict is unavailable ('${VERDICT}'), and gate_mode is log-only so nothing is enforced. Treat this run as UNKNOWN, not clean."
                ;;
            esac
          fi

          [ "$RESULT" = "success" ] || exit 1

  conformance:
    needs: source-security
    if: ${{ always() }}

    uses: IamRitz/ssd-security-framework/.github/workflows/_conformance.yml@3bae4435bb8fb582eb857654b5b3ccee51350905

    with:
      toolkit_ref: 3bae4435bb8fb582eb857654b5b3ccee51350905

      phase: pr

      artifact_type: library
      registry: none
      deploy_target: none
      break_glass_enabled: true
      strict_break_glass_evidence: true

      observed: >-
        {"secret-scan":{"status":"${{ needs.source-security.outputs.secret_scan_result }}","evidence":"Secret scanning job (per-control output)"},
         "dependency-scan":{"status":"${{ needs.source-security.outputs.dependency_scan_result }}","evidence":"Dependency scanning job (per-control output)"},
         "sast":{"status":"${{ needs.source-security.outputs.sast_result }}","evidence":"SAST job (per-control output)"},
         "source-gate":{"status":"${{ needs.source-security.outputs.source_gate_result }}","verdict":"${{ needs.source-security.outputs.verdict }}","gate_mode":"${{ needs.source-security.outputs.gate_mode }}","integrity_trusted":"${{ needs.source-security.outputs.integrity_trusted }}","evidence":"source-gate job"}}
