name: Security checks

on:
  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 6 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    uses: IamRitz/ssd-security-framework/.github/workflows/_source-scan.yml@158b3fbb69f68c8a1c6d26233acf833309d0ca2d

    permissions:
      contents: read
      pull-requests: write

    with:
      toolkit_ref: 158b3fbb69f68c8a1c6d26233acf833309d0ca2d

      gate_mode: enforce

      semgrep_configs: |
        p/owasp-top-ten
        p/python

      semgrep_paths: src

      break_glass_enabled: true
      break_glass_transport: lambda

      # Fabricated eligible dependency BLOCK for this test only.
      synthetic_block_fixture: dependency

  break-glass:
    needs:
      - source-security

    # Normal production-shaped condition:
    # only run when the source workflow actually delegates an eligible,
    # trusted, enforced BLOCK.
    if: ${{ always() && needs.source-security.outputs.break_glass_delegated == 'true' }}

    uses: IamRitz/ssd-security-framework/.github/workflows/_break-glass-lambda.yml@158b3fbb69f68c8a1c6d26233acf833309d0ca2d

    permissions:
      contents: read
      id-token: write

    with:
      toolkit_ref: 158b3fbb69f68c8a1c6d26233acf833309d0ca2d

      gate_mode: ${{ needs.source-security.outputs.gate_mode }}
      expected_gate_digest: ${{ needs.source-security.outputs.gate_digest }}

      # Production placeholders.
      # These MUST differ from the synthetic pair so the framework can prove
      # synthetic isolation. They are not expected to be invoked in this test.
      lambda_function: ssd-break-glass-prod-placeholder
      lambda_role_arn: arn:aws:iam::157328692276:role/ssd-break-glass-prod-placeholder
      aws_region: us-east-1

      # Real synthetic test resources.
      synthetic_lambda_function: ssd-break-glass-synthetic
      synthetic_lambda_role_arn: arn:aws:iam::157328692276:role/ssd-break-glass-synthetic-invoker
      synthetic_aws_region: us-east-1

      timeout_seconds: '30'

  security-gate:
    name: security-gate

    needs:
      - source-security
      - break-glass

    if: ${{ always() }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      source_outcome: ${{ steps.gate.outputs.source_outcome }}
      source_override: ${{ steps.gate.outputs.source_override }}

    steps:
      - name: Check out the security framework toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: IamRitz/ssd-security-framework
          ref: 3bae4435bb8fb582eb857654b5b3ccee51350905
          path: .ssd-toolkit
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Evaluate final source gate
        id: gate
        env:
          SSD_TOOLKIT: ${{ github.workspace }}/.ssd-toolkit/security

          SOURCE_RESULT: ${{ needs.source-security.result }}
          SOURCE_VERDICT: ${{ needs.source-security.outputs.verdict }}
          SOURCE_GATE_MODE: ${{ needs.source-security.outputs.gate_mode }}
          SOURCE_INTEGRITY_TRUSTED: ${{ needs.source-security.outputs.integrity_trusted }}
          SOURCE_BREAK_GLASS_ELIGIBLE: ${{ needs.source-security.outputs.break_glass_eligible }}
          SOURCE_BREAK_GLASS_DELEGATED: ${{ needs.source-security.outputs.break_glass_delegated }}

          SOURCE_SECRET_SCAN_RESULT: ${{ needs.source-security.outputs.secret_scan_result }}
          SOURCE_DEPENDENCY_SCAN_RESULT: ${{ needs.source-security.outputs.dependency_scan_result }}
          SOURCE_SAST_RESULT: ${{ needs.source-security.outputs.sast_result }}

          SOURCE_GATE_DIGEST: ${{ needs.source-security.outputs.gate_digest }}

          BREAK_GLASS_RESULT: ${{ needs.break-glass.result }}
          BREAK_GLASS_DECISION: ${{ needs.break-glass.outputs.decision_status }}
          BREAK_GLASS_REQUEST_DELIVERED: ${{ needs.break-glass.outputs.request_delivered }}
          BREAK_GLASS_GATE_DIGEST: ${{ needs.break-glass.outputs.gate_digest }}

        run: |
          set -euo pipefail

          echo "source-security:"
          echo "  result=${SOURCE_RESULT:-unknown}"
          echo "  verdict=${SOURCE_VERDICT:-unknown}"
          echo "  trusted=${SOURCE_INTEGRITY_TRUSTED:-unknown}"
          echo "  eligible=${SOURCE_BREAK_GLASS_ELIGIBLE:-unknown}"
          echo "  delegated=${SOURCE_BREAK_GLASS_DELEGATED:-unknown}"

          echo "break-glass:"
          echo "  result=${BREAK_GLASS_RESULT:-unknown}"
          echo "  decision=${BREAK_GLASS_DECISION:-unknown}"
          echo "  delivered=${BREAK_GLASS_REQUEST_DELIVERED:-unknown}"

          node "$SSD_TOOLKIT/scripts/final-gate.mjs"

  conformance:
    needs:
      - source-security
      - break-glass
      - security-gate

    if: ${{ always() }}

    uses: IamRitz/ssd-security-framework/.github/workflows/_conformance.yml@158b3fbb69f68c8a1c6d26233acf833309d0ca2d

    with:
      toolkit_ref: 158b3fbb69f68c8a1c6d26233acf833309d0ca2d

      phase: pr

      artifact_type: library
      registry: none
      deploy_target: none

      break_glass_enabled: true
      strict_break_glass_evidence: true

      observed: >-
        {
          "secret-scan":{
            "status":"${{ needs.source-security.outputs.secret_scan_result }}",
            "evidence":"Secret scanning job (per-control output)"
          },
          "dependency-scan":{
            "status":"${{ needs.source-security.outputs.dependency_scan_result }}",
            "evidence":"Dependency scanning job (per-control output)"
          },
          "sast":{
            "status":"${{ needs.source-security.outputs.sast_result }}",
            "evidence":"SAST job (per-control output)"
          },
          "source-gate":{
            "status":"${{ needs.source-security.outputs.source_gate_result }}",
            "verdict":"${{ needs.source-security.outputs.verdict }}",
            "gate_mode":"${{ needs.source-security.outputs.gate_mode }}",
            "integrity_trusted":"${{ needs.source-security.outputs.integrity_trusted }}",
            "break_glass_eligible":"${{ needs.source-security.outputs.break_glass_eligible }}",
            "gate_digest":"${{ needs.source-security.outputs.gate_digest }}",
            "override":"${{ needs.security-gate.outputs.source_override }}",
            "evidence":"source-gate job; override claim from final security-gate"
          },
          "break-glass":{
            "status":"${{ needs.break-glass.result }}",
            "decision":"${{ needs.break-glass.outputs.decision_status }}",
            "request_delivered":"${{ needs.break-glass.outputs.request_delivered }}",
            "gate_digest":"${{ needs.break-glass.outputs.gate_digest }}",
            "delegated":"${{ needs.source-security.outputs.break_glass_delegated }}",
            "evidence":"_break-glass-lambda.yml synthetic approval"
          }
        }
